# Example WiX Installer in YAML Format
# This demonstrates a simple installer with comments and clean structure

Wix:
  xmlns: "http://wixtoolset.org/schemas/v4/wxs"
  
  # Main Package Definition (Replaces Product in WiX v4)
  Package:
    Name: "My Application"
    Language: "1033"
    Version: "1.0.0.0"
    Manufacturer: "ACME Corporation"
    UpgradeCode: "12345678-1234-1234-1234-123456789012"
    InstallerVersion: "500"
    Compressed: "yes"
    Scope: "perMachine"
    
    SummaryInformation:
      Description: "Installs My Application v1.0"
      Keywords: "My Application Installer Package"
      Manufacturer: "ACME Corporation"
    
    # Handle upgrades
    MajorUpgrade:
      DowngradeErrorMessage: "A newer version of [ProductName] is already installed."
      Schedule: "afterInstallInitialize"
    
    # Media Configuration
    MediaTemplate:
      EmbedCab: "yes"
      CompressionLevel: "high"
    
    # Directory Structure
    Directory:
      Id: "TARGETDIR"
      Name: "SourceDir"
      
      # Program Files
      Directory:
        - Id: "ProgramFiles64Folder"
          
          Directory:
            Id: "ManufacturerFolder"
            Name: "ACME"
            
            Directory:
              Id: "INSTALLFOLDER"
              Name: "MyApp"
              
              # Main Application Component
              Component:
                - Id: "MainExecutable"
                  Guid: "AAAAAAAA-BBBB-CCCC-DDDD-EEEEEEEEEEEE"
                  Win64: "yes"
                  
                  File:
                    - Id: "MainExe"
                      Source: "bin/Release/MyApp.exe"
                      KeyPath: "yes"
                    
                    - Id: "ConfigFile"
                      Source: "config/app.config"
                    
                    - Id: "ReadmeFile"
                      Source: "README.txt"
                
                - Id: "Libraries"
                  Guid: "BBBBBBBB-CCCC-DDDD-EEEE-FFFFFFFFFFFF"
                  Win64: "yes"
                  
                  File:
                    - Id: "LibraryDll"
                      Source: "bin/Release/MyLibrary.dll"
                      KeyPath: "yes"
      
        - Id: "ProgramMenuFolder"
          
          Directory:
            Id: "ApplicationProgramsFolder"
            Name: "My Application"
            
            Component:
              - Id: "StartMenuShortcuts"
                Guid: "CCCCCCCC-DDDD-EEEE-FFFF-000000000000"
                
                Shortcut:
                  - Id: "ApplicationStartMenuShortcut"
                    Name: "My Application"
                    Target: "[INSTALLFOLDER]MyApp.exe"
                    WorkingDirectory: "INSTALLFOLDER"
                    Icon: "AppIcon"
                    IconIndex: "0"
                  
                  - Id: "UninstallShortcut"
                    Name: "Uninstall My Application"
                    Target: "[SystemFolder]msiexec.exe"
                    Arguments: "/x [ProductCode]"
                
                RemoveFolder:
                  Id: "CleanUpShortCut"
                  Directory: "ApplicationProgramsFolder"
                  On: "uninstall"
                
                RegistryValue:
                  Root: "HKCU"
                  Key: "Software\\ACME\\MyApp"
                  Name: "StartMenuShortcut"
                  Type: "integer"
                  Value: "1"
                  KeyPath: "yes"
      
        - Id: "DesktopFolder"
          
          Component:
            Id: "DesktopShortcut"
            Guid: "DDDDDDDD-EEEE-FFFF-0000-111111111111"
            
            Shortcut:
              Id: "ApplicationDesktopShortcut"
              Name: "My Application"
              Target: "[INSTALLFOLDER]MyApp.exe"
              WorkingDirectory: "INSTALLFOLDER"
              Icon: "AppIcon"
              IconIndex: "0"
            
            RegistryValue:
              Root: "HKCU"
              Key: "Software\\ACME\\MyApp"
              Name: "DesktopShortcut"
              Type: "integer"
              Value: "1"
              KeyPath: "yes"
    
    # Icon Definition
    Icon:
      Id: "AppIcon"
      SourceFile: "resources/app.ico"
    
    # Properties
    Property:
      - Id: "ARPPRODUCTICON"
        Value: "AppIcon"
      
      - Id: "ARPHELPLINK"
        Value: "https://www.acme.com/support"
      
      - Id: "ARPURLINFOABOUT"
        Value: "https://www.acme.com/myapp"

      - Id: "WIXUI_INSTALLDIR"
        Value: "INSTALLFOLDER"
    
    # Features
    Feature:
      - Id: "MainApplication"
        Title: "Main Application"
        Description: "The main application executable and libraries"
        Level: "1"
        ConfigurableDirectory: "INSTALLFOLDER"
        
        ComponentRef:
          - Id: "MainExecutable"
          - Id: "Libraries"
          - Id: "StartMenuShortcuts"
      
      - Id: "DesktopShortcutFeature"
        Title: "Desktop Shortcut"
        Description: "Add a shortcut to the desktop"
        Level: "1"
        
        ComponentRef:
          Id: "DesktopShortcut"
    
    # UI
    UIRef:
      - Id: "WixUI_InstallDir"
      - Id: "WixUI_ErrorProgressText"
