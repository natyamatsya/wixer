[config]
skip_core_tasks = true
default_to_workspace = false

# =============================================================================
# Core Build Tasks
# =============================================================================

[tasks.build-release]
description = "Build wixer in release mode"
command = "cargo"
args = ["build", "--release"]

[tasks.coverage-clean]
description = "Clean coverage artifacts"
command = "cargo"
args = ["llvm-cov", "clean", "--workspace"]

[tasks.coverage]
description = "Generate LCOV coverage report at target/coverage.lcov"
command = "cargo"
args = ["llvm-cov", "--workspace", "--lcov", "--output-path", "target/coverage.lcov"]

[tasks.coverage-refresh]
description = "Clean and regenerate LCOV coverage report"
dependencies = ["coverage-clean", "coverage"]

[tasks.coverage-html]
description = "Generate HTML coverage report"
command = "cargo"
args = ["llvm-cov", "--workspace", "--html"]

[tasks.coverage-open-html]
description = "Open HTML coverage report"
dependencies = ["coverage-html"]
script_runner = "pwsh"
script_extension = "ps1"
script = '''
Start-Process "target/llvm-cov/html/index.html"
'''

[tasks.coverage-summary]
description = "Summarize target/coverage.lcov"
command = "python"
args = ["wixer/tools/coverage_summary.py"]

[tasks.coverage-summary-yaml-xml]
description = "Summarize coverage with focus on YAML<->XML modules"
command = "python"
args = [
    "wixer/tools/coverage_summary.py",
    "--focus",
    "wixer/src/yaml_to_wix.rs",
    "--focus",
    "wixer/src/wix_to_yaml.rs",
    "--focus",
    "wixer/src/includes.rs",
]

[tasks.coverage-min-file]
description = "Fail if any tracked source file is below minimum line coverage"
command = "python"
args = [
    "wixer/tools/coverage_summary.py",
    "--min-file-line",
    "30",
    "--include",
    "wixer/src/**/*.rs",
    "--exclude",
    "wixer/src/bin/**",
    "--exclude",
    "wixer/src/commands/**",
]

# =============================================================================
# VS Code Extension Tasks
# =============================================================================

[tasks.vscode-install-deps]
description = "Install VS Code extension dependencies"
script_runner = "@shell"
script = '''
cd wixer-vscode
npm install
'''

[tasks.vscode-compile]
description = "Compile VS Code extension TypeScript"
dependencies = ["vscode-install-deps"]
script_runner = "@shell"
script = '''
cd wixer-vscode
npm run compile
'''

[tasks.vscode-package]
description = "Package VS Code extension as .vsix"
dependencies = ["vscode-compile"]
script_runner = "@shell"
script = '''
cd wixer-vscode
npx @vscode/vsce package
'''

# =============================================================================
# YAML Export Tasks
# =============================================================================

[tasks.yaml-export]
description = "Export WiX YAML sources to XML"
dependencies = ["build-release"]
command = "cargo"
args = ["run", "--release", "--bin", "wixer", "--", "export", ".", "target/wix"]

# =============================================================================
# MSI Installer Tasks (using wixer build)
# =============================================================================

[tasks.wixer-package-msi-build]
description = "Build wixer MSI installer from YAML using wixer"
dependencies = ["build-release", "vscode-package"]
command = "cargo"
args = [
    "run",
    "--release",
    "--bin",
    "wixer",
    "--",
    "build",
    "wixer.wxs.yaml",
    "-o",
    "target/wixer.msi",
]

[tasks.wixer-package-msi]
description = "Build and sign wixer MSI installer"
dependencies = ["wixer-package-msi-build", "wixer-codesign-msi"]

[tasks.wix-installer]
description = "Build MSI installer from YAML using wixer"
dependencies = ["wixer-package-msi"]

# =============================================================================
# MSIX Packaging Tasks
# =============================================================================

[tasks.msix-migrate]
description = "Generate AppxManifest from WiX YAML using wixer migrate"
dependencies = ["build-release"]
command = "cargo"
args = [
    "run",
    "--release",
    "--bin",
    "wixer",
    "--",
    "migrate",
    "--target",
    "msix",
    "./wixer.wxs.yaml",
    "target/msix",
]

[tasks.msix-prepare]
description = "Prepare MSIX staging directory"
dependencies = ["msix-migrate", "vscode-package"]
script_runner = "pwsh"
script_extension = "ps1"
script = '''
# Copy executable to MSIX staging
Copy-Item -Path "target/release/wixer.exe" -Destination "target/msix/" -Force
# Copy assets (create Assets dir if needed)
if (-not (Test-Path "target/msix/Assets")) { New-Item -ItemType Directory -Path "target/msix/Assets" -Force | Out-Null }
Copy-Item -Path "assets/*" -Destination "target/msix/Assets/" -Force
# Copy VS Code extension
if (-not (Test-Path "target/msix/vscode")) { New-Item -ItemType Directory -Path "target/msix/vscode" -Force | Out-Null }
Get-ChildItem -Path "wixer-vscode/wixer-vscode-*.vsix" | ForEach-Object {
    Copy-Item -Path $_.FullName -Destination "target/msix/vscode/" -Force
    Write-Host "Copied VS Code extension: $($_.Name)"
}
'''

[tasks.msix-pack]
description = "Create MSIX package using MakeAppx"
dependencies = ["msix-prepare"]
script_runner = "pwsh"
script_extension = "ps1"
script = '''
if (-not (Get-Command MakeAppx -ErrorAction SilentlyContinue)) {
    Write-Error "MakeAppx not found in PATH. Initialize your Windows SDK environment (e.g. run from a Visual Studio Developer Command Prompt / VsDevCmd) and try again."
    exit 1
}

MakeAppx pack /d target/msix /p target/wixer.msix /o
'''

[tasks.wixer-package-msix-build]
description = "Build wixer MSIX package (manifest + staging + MakeAppx pack)"
dependencies = ["msix-pack"]

[tasks.wixer-package-msix]
description = "Build and sign wixer MSIX package"
dependencies = ["wixer-package-msix-build", "wixer-codesign-msix"]

[tasks.wixer-codesign-cert]
description = "Create/reuse a self-signed code signing cert and write metadata under target/.wixer-tmp/codesign"
script_runner = "pwsh"
script_extension = "ps1"
script = '''
$ErrorActionPreference = "Stop"

$tmpRoot = "target/.wixer-tmp/codesign"
if (Test-Path $tmpRoot) { Remove-Item -Recurse -Force $tmpRoot | Out-Null }
New-Item -ItemType Directory -Path $tmpRoot -Force | Out-Null

$subject = $env:WIXER_CODESIGN_SUBJECT

if ([string]::IsNullOrWhiteSpace($subject)) {
    $manifest = "target/msix/AppxManifest.xml"
    if (Test-Path $manifest) {
        $content = Get-Content -Path $manifest -Raw
        $m = [regex]::Match($content, 'Publisher\s*=\s*"([^"]+)"')
        if ($m.Success) {
            $subject = $m.Groups[1].Value
        }
    }
}

if ([string]::IsNullOrWhiteSpace($subject)) {
    $subject = "CN=Wixer Dev Code Signing"
}

Set-Content -Path "$tmpRoot/subject.txt" -Value $subject

$existing = Get-ChildItem -Path "Cert:\CurrentUser\My" | Where-Object { $_.Subject -eq $subject } | Select-Object -First 1

if ($null -eq $existing) {
    $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $subject -CertStoreLocation "Cert:\CurrentUser\My" -KeyExportPolicy Exportable -KeySpec Signature -NotAfter (Get-Date).AddYears(5)
} else {
    $cert = $existing
}

$thumb = $cert.Thumbprint
Set-Content -Path "$tmpRoot/thumbprint.txt" -Value $thumb

$cerPath = "$tmpRoot/wixer-dev-codesign.cer"
Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null

Write-Host "Using code signing cert subject: $subject"
Write-Host "Thumbprint: $thumb"
Write-Host "Exported public cert: $cerPath"
'''

[tasks.wixer-codesign-trust]
description = "Install the self-signed code signing cert into CurrentUser\\TrustedPeople (for local MSIX install)"
dependencies = ["wixer-codesign-cert"]
script_runner = "pwsh"
script_extension = "ps1"
script = '''
$ErrorActionPreference = "Stop"

$cerPath = "target/.wixer-tmp/codesign/wixer-dev-codesign.cer"
if (-not (Test-Path $cerPath)) {
    Write-Error "Missing cert file: $cerPath"
    exit 1
}

Import-Certificate -FilePath $cerPath -CertStoreLocation "Cert:\CurrentUser\TrustedPeople" | Out-Null
Write-Host "Imported cert into CurrentUser\\TrustedPeople"
'''

[tasks.wixer-codesign-msi]
description = "Sign target/wixer.msi using the self-signed code signing cert"
dependencies = ["wixer-codesign-cert"]
script_runner = "pwsh"
script_extension = "ps1"
script = '''
$ErrorActionPreference = "Stop"

$require = $env:WIXER_CODESIGN_REQUIRE -eq "1"
$signtool = Get-Command signtool -ErrorAction SilentlyContinue
if ($null -eq $signtool) {
    if ($require) { Write-Error "signtool not found in PATH"; exit 1 }
    Write-Host "signtool not found; skipping MSI signing"
    exit 0
}

$msi = "target/wixer.msi"
if (-not (Test-Path $msi)) {
    Write-Error "Missing MSI: $msi"
    exit 1
}

$thumb = (Get-Content "target/.wixer-tmp/codesign/thumbprint.txt" -ErrorAction Stop).Trim()

$timestamp = $env:WIXER_CODESIGN_TIMESTAMP_URL
if ([string]::IsNullOrWhiteSpace($timestamp)) {
    & $signtool.Path sign /fd SHA256 /sha1 $thumb /v $msi
} else {
    & $signtool.Path sign /fd SHA256 /sha1 $thumb /tr $timestamp /td SHA256 /v $msi
}

if ($LASTEXITCODE -ne 0) {
    if ($require) { Write-Error "MSI signing failed (exit code $LASTEXITCODE)"; exit $LASTEXITCODE }
    Write-Host "MSI signing failed (exit code $LASTEXITCODE); leaving unsigned: $msi"
    exit 0
}

Write-Host "Signed MSI: $msi"
'''

[tasks.wixer-codesign-msix]
description = "Sign target/wixer.msix using the self-signed code signing cert"
dependencies = ["wixer-codesign-cert"]
script_runner = "pwsh"
script_extension = "ps1"
script = '''
$ErrorActionPreference = "Stop"

$require = $env:WIXER_CODESIGN_REQUIRE -eq "1"
$signtool = Get-Command signtool -ErrorAction SilentlyContinue
if ($null -eq $signtool) {
    if ($require) { Write-Error "signtool not found in PATH"; exit 1 }
    Write-Host "signtool not found; skipping MSIX signing"
    exit 0
}

$msix = "target/wixer.msix"
if (-not (Test-Path $msix)) {
    Write-Error "Missing MSIX: $msix"
    exit 1
}

$thumb = (Get-Content "target/.wixer-tmp/codesign/thumbprint.txt" -ErrorAction Stop).Trim()

$timestamp = $env:WIXER_CODESIGN_TIMESTAMP_URL
if ([string]::IsNullOrWhiteSpace($timestamp)) {
    & $signtool.Path sign /fd SHA256 /sha1 $thumb /v $msix
} else {
    & $signtool.Path sign /fd SHA256 /sha1 $thumb /tr $timestamp /td SHA256 /v $msix
}

if ($LASTEXITCODE -ne 0) {
    Write-Host "MSIX signing failed (exit code $LASTEXITCODE); attempting .appx fallback"

    $fallbackDir = "target/.wixer-tmp/codesign"
    New-Item -ItemType Directory -Path $fallbackDir -Force | Out-Null

    $appx = "$fallbackDir/wixer.appx"
    Copy-Item -Path $msix -Destination $appx -Force

    if ([string]::IsNullOrWhiteSpace($timestamp)) {
        & $signtool.Path sign /fd SHA256 /sha1 $thumb /v $appx
    } else {
        & $signtool.Path sign /fd SHA256 /sha1 $thumb /tr $timestamp /td SHA256 /v $appx
    }

    if ($LASTEXITCODE -ne 0) {
        if ($require) { Write-Error "MSIX signing failed (exit code $LASTEXITCODE)"; exit $LASTEXITCODE }
        Write-Host "MSIX signing failed (exit code $LASTEXITCODE); leaving unsigned: $msix"
        exit 0
    }

    Move-Item -Path $appx -Destination $msix -Force
}

Write-Host "Signed MSIX: $msix"
'''

[tasks.msix-bundle]
description = "Create MSIX bundle"
dependencies = ["msix-pack"]
script_runner = "pwsh"
script_extension = "ps1"
script = '''
if (-not (Get-Command MakeAppx -ErrorAction SilentlyContinue)) {
    Write-Error "MakeAppx not found in PATH. Initialize your Windows SDK environment (e.g. run from a Visual Studio Developer Command Prompt / VsDevCmd) and try again."
    exit 1
}

if (-not (Test-Path "target/msix-bundle")) { New-Item -ItemType Directory -Path "target/msix-bundle" -Force | Out-Null }
Copy-Item -Path "target/wixer.msix" -Destination "target/msix-bundle/" -Force

MakeAppx bundle /d target/msix-bundle /p target/wixer.msixbundle /bv 0.1.0.0 /o
'''

# =============================================================================
# CMake-based Tasks (using presets)
# =============================================================================

[tasks.cmake-configure]
description = "Configure CMake build with wixer impersonation"
dependencies = ["build-release", "vscode-package"]
command = "cmake"
args = ["--preset", "wixer-rel"]

[tasks.cmake-configure-auto]
description = "Configure CMake build with auto MSIX from YAML"
dependencies = ["build-release", "vscode-package"]
command = "cmake"
args = ["--preset", "wixer-rel-auto"]

[tasks.cmake-yaml-export]
description = "Export YAML to XML via CMake"
dependencies = ["cmake-configure"]
command = "cmake"
args = ["--build", "--preset", "wixer-yaml-export"]

[tasks.cmake-msi]
description = "Build MSI installer via CMake/CPack with wixer impersonation"
dependencies = ["cmake-yaml-export"]
script_runner = "@shell"
script = '''
cd build
. ./wixer_env.ps1
cpack -G WIX
'''

[tasks.cmake-msix-legacy]
description = "Build MSIX via CMake/CPack (legacy AppxManifest.xml.in)"
dependencies = ["cmake-configure"]
command = "cpack"
args = ["--preset", "wixer-rel-msix"]

[tasks.cmake-msix-auto]
description = "Build MSIX via CMake/CPack (auto-generated from YAML)"
command = "cmake"
args = ["--workflow", "--preset", "wixer-auto-msix"]

[tasks.cmake-full]
description = "Full CMake workflow: configure, export YAML, build MSI"
command = "cmake"
args = ["--workflow", "--preset", "wixer-rel-pkg"]

# =============================================================================
# Gallery Tasks
# =============================================================================
#
# Gallery structure:
#   wixer/examples/WiXInstallerExamples/  - Git submodule (read-only source)
#   wixer/examples/configs/               - Build configs for each example
#   wixer/examples/wixer-yaml/            - Curated YAML gallery (tracked in git)
#   wixer/examples/gallery/wix-v4/        - Generated v4 XML (gitignored)
#   wixer/examples/gallery/msi/           - Built MSI packages (gitignored)
#
# Workflow:
#   cargo make gallery          - Regenerate wix-v4/ from submodule
#   cargo make gallery-build    - Build MSI from curated wixer-yaml/
#   cargo make gallery-refresh  - Update wixer-yaml/ from wix-v4/ (manual review)
#

[tasks.gallery]
description = "Regenerate wix-v4/ from submodule (does not modify curated yaml)"
dependencies = ["build-release"]
command = "cargo"
args = [
    "run",
    "--release",
    "--bin",
    "wixer-gallery",
    "--",
    "--source",
    "wixer/examples/WiXInstallerExamples",
    "--output",
    "wixer/examples/gallery",
    "--configs",
    "wixer/examples/configs",
    "--yaml-gallery",
    "wixer/examples/wixer-yaml",
    "--upgrade",
    "--clean",
]

[tasks.gallery-build]
description = "Build MSI packages from curated wixer-yaml/ gallery"
dependencies = ["build-release"]
command = "cargo"
args = [
    "run",
    "--release",
    "--bin",
    "wixer-gallery",
    "--",
    "--source",
    "wixer/examples/WiXInstallerExamples",
    "--output",
    "wixer/examples/gallery",
    "--configs",
    "wixer/examples/configs",
    "--yaml-gallery",
    "wixer/examples/wixer-yaml",
    "--build",
    "--clean",
]

[tasks.gallery-msix]
description = "Generate MSIX manifest outputs from curated wixer-yaml/ gallery"
dependencies = ["build-release"]
command = "cargo"
args = [
    "run",
    "--release",
    "--bin",
    "wixer-gallery",
    "--",
    "--source",
    "wixer/examples/WiXInstallerExamples",
    "--output",
    "wixer/examples/gallery",
    "--configs",
    "wixer/examples/configs",
    "--yaml-gallery",
    "wixer/examples/wixer-yaml",
    "--msix",
    "--clean",
    "${@}",
]

[tasks.gallery-msix-validate]
description = "Generate and validate MSIX outputs (Level 1 + Level 2 when MakeAppx is available)"
dependencies = ["build-release"]
command = "cargo"
args = [
    "run",
    "--release",
    "--bin",
    "wixer-gallery",
    "--",
    "--source",
    "wixer/examples/WiXInstallerExamples",
    "--output",
    "wixer/examples/gallery",
    "--configs",
    "wixer/examples/configs",
    "--yaml-gallery",
    "wixer/examples/wixer-yaml",
    "--msix",
    "--validate",
    "--clean",
]

[tasks.gallery-refresh]
description = "Refresh curated wixer-yaml/ from upgraded v4 files (review changes!)"
dependencies = ["build-release"]
command = "cargo"
args = [
    "run",
    "--release",
    "--bin",
    "wixer-gallery",
    "--",
    "--source",
    "wixer/examples/WiXInstallerExamples",
    "--output",
    "wixer/examples/gallery",
    "--configs",
    "wixer/examples/configs",
    "--yaml-gallery",
    "wixer/examples/wixer-yaml",
    "--upgrade",
    "--refresh",
    "--clean",
]

[tasks.gallery-build-example]
description = "Build a specific example (e.g., cargo make gallery-build-example 00)"
dependencies = ["build-release"]
command = "cargo"
args = [
    "run",
    "--release",
    "--bin",
    "wixer-gallery",
    "--",
    "--source",
    "wixer/examples/WiXInstallerExamples",
    "--output",
    "wixer/examples/gallery",
    "--configs",
    "wixer/examples/configs",
    "--yaml-gallery",
    "wixer/examples/wixer-yaml",
    "--build",
    "--only",
    "${@}",
]

[tasks.gallery-verbose]
description = "Build gallery with verbose output"
dependencies = ["build-release"]
command = "cargo"
args = [
    "run",
    "--release",
    "--bin",
    "wixer-gallery",
    "--",
    "--source",
    "wixer/examples/WiXInstallerExamples",
    "--output",
    "wixer/examples/gallery",
    "--configs",
    "wixer/examples/configs",
    "--yaml-gallery",
    "wixer/examples/wixer-yaml",
    "--build",
    "--clean",
    "--verbose",
]

# =============================================================================
# Convenience Aliases
# =============================================================================

[tasks.wixer-package]
description = "Build wixer packages (MSI + MSIX)"
dependencies = ["wixer-package-msi", "wixer-package-msix"]

[tasks.msi]
description = "Build MSI installer (alias for wixer-package-msi)"
dependencies = ["wixer-package-msi"]

[tasks.msix]
description = "Build MSIX package (alias for wixer-package-msix)"
dependencies = ["wixer-package-msix"]

[tasks.msix-auto]
description = "Build MSIX with auto-generated AppxManifest from YAML"
dependencies = ["cmake-msix-auto"]

[tasks.all]
description = "Build all packages (MSI + MSIX)"
dependencies = ["wixer-package"]

# =============================================================================
# Default Task
# =============================================================================

[tasks.default]
description = "Build MSI and MSIX packages"
dependencies = ["all"]
