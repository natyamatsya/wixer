Wix:
  xmlns: 'http://wixtoolset.org/schemas/v4/wxs'
  xmlns:util: 'http://wixtoolset.org/schemas/v4/wxs/util'
  Package:
    Name: 'Wixer'
    Language: '1033'
    Version: '0.1.0.0'
    Manufacturer: 'Natyamatsya'
    UpgradeCode: 'd0c5a0e0-5d2a-4b0e-9f0a-1c8b3d4e5f6a'
    InstallerVersion: '200'
    Compressed: 'yes'
    Scope: 'perMachine'
    MajorUpgrade:
      DowngradeErrorMessage: 'A newer version of [ProductName] is already installed.'
    MediaTemplate:
      EmbedCab: 'yes'
    Property:
      - Id: 'VSCODE_PATH'
        Secure: 'yes'
    # Custom action to install VS Code extension
    CustomAction:
      - Id: 'InstallVSCodeExtension'
        Directory: 'INSTALLFOLDER'
        ExeCommand: '"[VSCODE_PATH]bin\code.cmd" --install-extension "[#VSCodeExtVsix]"'
        Execute: 'deferred'
        Impersonate: 'yes'
        Return: 'ignore'
    InstallExecuteSequence:
      Custom:
        Action: 'InstallVSCodeExtension'
        After: 'InstallFiles'
        Condition: 'VSCODE_PATH AND &VSCodeExtension=3'
    # Set VS Code extension feature to Level 1 (enabled) when VS Code is detected
    SetProperty:
      - Id: 'VSCodeExtension'
        Value: '1'
        Sequence: 'first'
        After: 'AppSearch'
        Condition: 'VSCODE_PATH'
    Feature:
      - Id: 'ProductFeature'
        Title: 'Wixer CLI'
        Description: 'Core wixer command-line tool'
        Level: '1'
        ComponentGroupRef:
          - Id: 'ProductComponents'
          - Id: 'PathComponents'
      - Id: 'VSCodeExtension'
        Title: 'VS Code Extension'
        Description: 'Language support for WiX YAML files in Visual Studio Code (requires VS Code)'
        Level: '1000'
        AllowAbsent: 'yes'
        ComponentGroupRef:
          Id: 'VSCodeComponents'
    StandardDirectory:
      - Id: 'ProgramFiles64Folder'
        Directory:
          Id: 'INSTALLFOLDER'
          Name: 'Wixer'
          Directory:
            Id: 'VSCODEEXTDIR'
            Name: 'vscode'
    ComponentGroup:
      - Id: 'ProductComponents'
        Directory: 'INSTALLFOLDER'
        Component:
          Id: 'ProductComponent'
          Guid: 'a1b2c3d4-e5f6-7890-1234-567890abcdef'
          File:
            Id: 'WixerExe'
            Source: 'target/release/wixer.exe'
            KeyPath: 'yes'
      - Id: 'PathComponents'
        Directory: 'INSTALLFOLDER'
        Component:
          Id: 'PathComponent'
          Guid: 'c3d4e5f6-a7b8-9012-3456-789012cdef01'
          Environment:
            Id: 'PathEnv'
            Name: 'PATH'
            Value: '[INSTALLFOLDER]'
            Permanent: 'no'
            Part: 'last'
            Action: 'set'
            System: 'yes'
      - Id: 'VSCodeComponents'
        Directory: 'VSCODEEXTDIR'
        Component:
          Id: 'VSCodeExtComponent'
          Guid: 'b2c3d4e5-f6a7-8901-2345-678901bcdef0'
          File:
            Id: 'VSCodeExtVsix'
            Source: 'wixer-vscode/wixer-vscode-0.1.0.vsix'
            KeyPath: 'yes'
  # Registry searches must be in a Fragment with util extension
  Fragment:
    util:RegistrySearch:
      # User install (traditional installer)
      - Id: 'VSCodeUserSearch'
        Root: 'HKCU'
        Key: 'Software\Microsoft\Windows\CurrentVersion\Uninstall\{771FD6B0-FA20-440A-A002-3B3BAC16DC50}_is1'
        Value: 'InstallLocation'
        Variable: 'VSCODE_PATH'
        Result: 'value'
      # System install (traditional installer)
      - Id: 'VSCodeMachineSearch'
        Root: 'HKLM'
        Key: 'Software\Microsoft\Windows\CurrentVersion\Uninstall\{EA457B21-F73E-494C-ACAB-524FDE069978}_is1'
        Value: 'InstallLocation'
        Variable: 'VSCODE_PATH'
        Result: 'value'
      # Winget/MSIX user install
      - Id: 'VSCodeWingetUserSearch'
        Root: 'HKCU'
        Key: 'Software\Microsoft\Windows\CurrentVersion\Uninstall\Microsoft.VisualStudioCode'
        Value: 'InstallLocation'
        Variable: 'VSCODE_PATH'
        Result: 'value'
      # Winget/MSIX machine install
      - Id: 'VSCodeWingetMachineSearch'
        Root: 'HKLM'
        Key: 'Software\Microsoft\Windows\CurrentVersion\Uninstall\Microsoft.VisualStudioCode'
        Value: 'InstallLocation'
        Variable: 'VSCODE_PATH'
        Result: 'value'
      # App Paths fallback (all install methods register here)
      - Id: 'VSCodeAppPathSearch'
        Root: 'HKLM'
        Key: 'Software\Microsoft\Windows\CurrentVersion\App Paths\Code.exe'
        Value: 'Path'
        Variable: 'VSCODE_PATH'
        Result: 'value'
