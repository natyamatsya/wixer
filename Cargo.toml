[workspace]
members = [
    "wixer",
]
exclude = [
    "wixer/examples/wixer-yaml/10_Rust_Axum_WeatherForecastInstaller/weather-api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
incremental = false

[profile.test]
incremental = false

[profile.ci]
inherits = "test"
incremental = false
codegen-units = 1
