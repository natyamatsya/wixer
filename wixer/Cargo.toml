[package]
name = "wixer"
version = "0.1.0"
edition = "2024"
description = "WiX YAML authoring toolkit"
license = "MIT"
repository = "https://github.com/natyamatsya/wixer"

[lib]
name = "wixer"
path = "src/lib.rs"

[[bin]]
name = "wixer"
path = "src/main.rs"

[[bin]]
name = "wixer-gallery"
path = "src/bin/gallery.rs"

[[bin]]
name = "prebuild-assets"
path = "src/bin/prebuild_assets.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
quick-xml = { version = "0.42", features = ["serialize"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
tokio = { version = "1.54", features = ["full"] }
jsonschema = "0.60"
roxmltree = "0.21"
indexmap = { version = "2.14", features = ["serde"] }
anyhow = "1.0"
regex = "1.13"
sha2 = "0.11.1"
hex = "0.4.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tower-lsp = "0.20"
walkdir = "2.4"
lazy_static = "1.4"
zip = "9.0.5"
tabled = "0.22.0"
strsim = "0.11.1"
directories = "6.0.0"
uuid = { version = "1.28.0", features = ["v4"] }
which = "8.0"
rayon = "1.12.0"

[build-dependencies]
zip = "9.0.5"
