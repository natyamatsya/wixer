[package]
name = "wixer"
version = "0.1.0"
edition = "2024"
description = "WiX YAML authoring toolkit"
license = "MIT"
repository = "https://github.com/natyamatsya/wixer"

[lib]
name = "wixer"
path = "src/lib.rs"

[[bin]]
name = "wixer"
path = "src/main.rs"

[[bin]]
name = "wixer-gallery"
path = "src/bin/gallery.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
quick-xml = { version = "0.36", features = ["serialize"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1.0", features = ["full"] }
jsonschema = "0.17"
roxmltree = "0.19"
indexmap = { version = "2.2", features = ["serde"] }
anyhow = "1.0"
regex = "1.10"
sha2 = "0.10.9"
hex = "0.4.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-lsp = "0.20"
walkdir = "2.4"
lazy_static = "1.4"
zip = "6.0.0"
tabled = "0.20.0"
strsim = "0.11.1"
directories = "6.0.0"
uuid = { version = "1.19.0", features = ["v4"] }
which = "7.0"
rayon = "1.11.0"
