name: "10_Rust_Axum_WeatherForecastInstaller"
description: "Rust/Axum Weather API - single binary deployment with no runtime dependencies"
arch: x64
buildable: true
defines:
  BinarySource: weather-api/target/release

prebuild:
  - tool: cargo
    cwd: weather-api
    args:
      - build
      - --release
    produces:
      - weather-api/target/release/weather-api.exe
