name: "10_ASP.NET_Core6_WeatherForecastInstaller"
description: "IIS-hosted ASP.NET Core 6 web application installer with WiX IIS extension"

defines:
  InstallerSource: "$(ProjectDir)..\\WeatherForecast\\bin\\Release\\net6.0\\publish\\"

extensions:
  - WixToolset.Util.wixext
  - WixToolset.Iis.wixext

sources:
  - 10_WeatherForecastInstaller/Product.wxs
  - 10_WeatherForecastInstaller/IISHostingFragment.wxs
  - 10_WeatherForecastInstaller/WeatherForecastGenerated.wxs

buildable: false
skip_reason: "Requires building and publishing the ASP.NET Core application first"

requires:
  - path: "../WeatherForecast/bin/Release/net6.0/publish"
    description: "Published ASP.NET Core application (dotnet publish WeatherForecast)"
