Wix:
  xmlns: http://wixtoolset.org/schemas/v4/wxs
  Package:
    ProductCode: '*'
    Language: '1033'
    Manufacturer: Acme Corporation
    Name: 10_WeatherForecastInstaller
    UpgradeCode: '{759305A4-6D58-44F7-9273-94F376DF0F77}'
    Version: 1.0.0.0
    Scope: perMachine
    Compressed: yes
    MajorUpgrade:
      DowngradeErrorMessage: A later version of [ProductName] is already installed. Setup will now exit.
    MediaTemplate:
      EmbedCab: yes
    Property:
      Id: POWERSHELLEXE
      RegistrySearch:
        Id: POWERSHELLEXE
        Type: raw
        Root: HKLM
        Key: SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell
        Name: Path
    StandardDirectory:
      Id: ProgramFilesFolder
      Directory:
        Id: MY_INSTALL_LOCATION
        Name: 10_WeatherForecastInstaller
    ComponentGroup:
      Directory: MY_INSTALL_LOCATION
      Id: ProductComponents
      Component:
        Id: cmpSetAppPoolManagedRuntimeVersion_ps1
        Guid: '*'
        File:
          Id: SetAppPoolManagedRuntimeVersion_ps1
          KeyPath: yes
          Source: SetAppPoolManagedRuntimeVersion.ps1
    Feature:
      Id: HelloWorldFeature
      ComponentGroupRef:
      - Id: WeatherForecastGroup
      - Id: ProductIISHostingComponents
      - Id: ProductComponents
    SetProperty:
    - Id: CA_SetAppPoolManagedRuntimeVersion
      Before: CA_SetAppPoolManagedRuntimeVersion
      Sequence: execute
      Value: '&quot;[WindowsFolder]\System32\WindowsPowerShell\v1.0\powershell.exe&quot; -NoLogo -NonInteractive -NoProfile -ExecutionPolicy Bypass -File &quot;[MY_INSTALL_LOCATION]SetAppPoolManagedRuntimeVersion.ps1&quot;'
    - Id: CA_SetAppPoolPermission
      Before: CA_SetAppPoolPermission
      Sequence: execute
      Value: '&quot;[SystemFolder]icacls.exe&quot; &quot;[MY_INSTALL_LOCATION].&quot; /grant &quot;IIS AppPool\WeatherForecastAppPool:(OI)(CI)F&quot; /T'
    CustomAction:
    - Id: CA_SetAppPoolManagedRuntimeVersion
      BinaryRef: WixCA
      DllEntry: CAQuietExec64
      Execute: deferred
      Return: check
      Impersonate: no
    - Id: CA_SetAppPoolPermission
      BinaryRef: WixCA
      DllEntry: CAQuietExec64
      Execute: deferred
      Return: check
      Impersonate: no
    InstallExecuteSequence:
      Custom:
      - Action: CA_SetAppPoolManagedRuntimeVersion
        Before: InstallFinalize
        Condition: NOT Installed
      - Action: CA_SetAppPoolPermission
        After: CA_SetAppPoolManagedRuntimeVersion
        Condition: NOT Installed
