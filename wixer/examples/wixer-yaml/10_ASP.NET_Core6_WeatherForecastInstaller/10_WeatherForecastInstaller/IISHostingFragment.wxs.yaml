Wix:
  xmlns: http://wixtoolset.org/schemas/v4/wxs
  Fragment:
    WebSite:
      Id: WeatherForecastWebSite
      Description: Default Web Site
      WebAddress:
        Id: WebAddress_DefaultWebSite
        Port: '80'
    ComponentGroup:
      Directory: MY_INSTALL_LOCATION
      Id: ProductIISHostingComponents
      Component:
      - Id: cmpAppPool
        Guid: '{E6F56DF0-8089-4FEB-89CC-EAA49F1BFCE7}'
        KeyPath: yes
        WebAppPool:
          Id: WeatherForecastAppPool
          Name: WeatherForecastAppPool
          ManagedRuntimeVersion: v4.0
          ManagedPipelineMode: Integrated
          Identity: applicationPoolIdentity
      - Id: cmpWebVirtualDir
        Guid: '{81C92868-A718-4F3C-B1B8-CC4EC5E5A1DB}'
        KeyPath: yes
        WebVirtualDir:
          Id: WebVirtualDir_WeatherForecast
          Alias: WeatherForecastWebApp
          Directory: MY_INSTALL_LOCATION
          WebSite: WeatherForecastWebSite
          WebApplication:
            Id: WebApplication_WeatherForecast
            Name: WeatherForecastWebApplication
            WebAppPool: WeatherForecastAppPool
