Wix:
  xmlns: http://wixtoolset.org/schemas/v4/wxs

  Package:
    Name: "07_CSharpCustomAction"
    Manufacturer: Wixer Examples
    Version: 1.0.0.0
    UpgradeCode: "A1B2C3D4-E5F6-7890-ABCD-EF1234567890"
    Scope: perMachine
    Compressed: yes

    MajorUpgrade:
      DowngradeErrorMessage: A newer version is already installed.

    MediaTemplate:
      EmbedCab: yes

    # Standard directories
    StandardDirectory:
      - Id: ProgramFiles64Folder
        Directory:
          - Id: INSTALLFOLDER
            Name: 07_CSharpCustomAction

    # Components
    ComponentGroup:
      Id: ProductComponents
      Directory: INSTALLFOLDER
      Component:
        - Id: ReadmeComponent
          Guid: "*"
          File:
            - Id: ReadmeFile
              Source: README.md
              KeyPath: yes

    # Binary containing the custom action DLL
    Binary:
      - Id: CustomActionBinary
        SourceFile: MyCSharpCustomAction/bin/x64/Release/net6.0-windows/win-x64/publish/MyCSharpCustomAction.dll

    # Custom Actions
    CustomAction:
      # Immediate action - runs with session access
      - Id: CA_Immediate
        BinaryRef: CustomActionBinary
        DllEntry: SampleImmediateAction
        Execute: immediate
        Return: check
      # Deferred action - runs elevated
      - Id: CA_Deferred
        BinaryRef: CustomActionBinary
        DllEntry: SampleDeferredAction
        Execute: deferred
        Return: check
        Impersonate: no
      # Rollback action
      - Id: CA_Rollback
        BinaryRef: CustomActionBinary
        DllEntry: SampleRollbackAction
        Execute: rollback
        Return: check
        Impersonate: no

    # Set up data for deferred action
    SetProperty:
      - Id: CA_Deferred
        Before: CA_Deferred
        Sequence: execute
        Value: "InstallDir=[INSTALLFOLDER];MyProperty=[MY_PROPERTY]"

    # Schedule custom actions
    InstallExecuteSequence:
      Custom:
        - Action: CA_Immediate
          Before: CA_Deferred
          Condition: NOT Installed
        - Action: CA_Rollback
          Before: CA_Deferred
          Condition: NOT Installed
        - Action: CA_Deferred
          Before: InstallFinalize
          Condition: NOT Installed

    # Feature
    Feature:
      Id: MainFeature
      Title: Main Feature
      Level: 1
      ComponentGroupRef:
        - Id: ProductComponents
