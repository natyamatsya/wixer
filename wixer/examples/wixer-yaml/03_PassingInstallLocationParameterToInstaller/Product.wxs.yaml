Wix:
  xmlns: http://wixtoolset.org/schemas/v4/wxs
  Package:
    ProductCode: '*'
    Language: '1033'
    Manufacturer: Acme Corporation
    Name: 03_PassingInstallLocationParameterToInstaller
    UpgradeCode: '{5903552B-DDE6-45B5-BAC6-A28208C8DF81}'
    Version: 1.0.0.0
    Scope: perMachine
    Compressed: yes
    MajorUpgrade:
      DowngradeErrorMessage: A later version of [ProductName] is already installed. Setup will now exit.
    MediaTemplate:
      EmbedCab: yes
    Property:
      Id: MY_PROPERTY
      Value: default value
    StandardDirectory:
      Id: ProgramFilesFolder
      Directory:
        Id: MY_INSTALL_LOCATION
        Name: 03_PassingInstallLocationParameterToInstaller
    ComponentGroup:
      Directory: MY_INSTALL_LOCATION
      Id: ProductComponentGroup
      Component:
      - Id: ProductComponent
        File:
          KeyPath: yes
          Source: FileToInstall.txt
      - Id: cmp_RegistryEntry
        Guid: '*'
        RegistryKey:
          Root: HKLM
          Key: Software\[Manufacturer]\[ProductName]
          RegistryValue:
            KeyPath: yes
            Type: string
            Name: My property
            Value: '[MY_PROPERTY]'
    Feature:
      Id: HelloWorldFeature
      ComponentGroupRef:
        Id: ProductComponentGroup
