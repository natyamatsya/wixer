# InstallationStages.wxi.yaml
# Reusable include file that defines installation stage properties.
# These SetProperty elements create boolean flags indicating the current installation stage:
# - FirstInstall: Fresh installation (not upgrade, not downgrade)
# - Upgrading: Upgrading from an older version
# - RemovingForUpgrade: Being removed as part of an upgrade
# - Uninstalling: Complete removal (not part of upgrade)
# - Maintenance: Repair/modify existing installation
#
# Usage: !include ../_includes/InstallationStages.wxi.yaml
#
# These properties can be used in CustomAction conditions to run different
# actions depending on the installation stage.

SetProperty:
  - Id: FirstInstall
    After: FindRelatedProducts
    Value: 'true'
    Condition: NOT Installed AND NOT WIX_UPGRADE_DETECTED AND NOT WIX_DOWNGRADE_DETECTED
  - Id: Upgrading
    After: SetFirstInstall
    Value: 'true'
    Condition: WIX_UPGRADE_DETECTED AND NOT (REMOVE="ALL")
  - Id: RemovingForUpgrade
    After: RemoveExistingProducts
    Sequence: execute
    Value: 'true'
    Condition: (REMOVE="ALL") AND UPGRADINGPRODUCTCODE
  - Id: Uninstalling
    After: SetUpgrading
    Value: 'true'
    Condition: Installed AND (REMOVE="ALL") AND NOT (WIX_UPGRADE_DETECTED OR UPGRADINGPRODUCTCODE)
  - Id: Maintenance
    After: SetUninstalling
    Value: 'true'
    Condition: Installed AND NOT Upgrading AND NOT Uninstalling AND NOT UPGRADINGPRODUCTCODE
