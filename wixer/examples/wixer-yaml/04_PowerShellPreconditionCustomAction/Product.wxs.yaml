Wix:
  xmlns: http://wixtoolset.org/schemas/v4/wxs
  Package:
    ProductCode: '*'
    Language: '1033'
    Manufacturer: Acme Corporation
    Name: 04_PowerShellPreconditionCustomAction
    UpgradeCode: '{FFA6A5DE-5551-4A45-B3B5-0C2F78E605AF}'
    Version: 1.0.0.0
    Scope: perMachine
    Compressed: yes
    MajorUpgrade:
      DowngradeErrorMessage: A later version of [ProductName] is already installed. Setup will now exit.
    MediaTemplate:
      EmbedCab: yes
    Property:
    - Id: POWERSHELLVERSION
      RegistrySearch:
        Id: POWERSHELLVERSION
        Type: raw
        Root: HKLM
        Key: SOFTWARE\Microsoft\PowerShell\3\PowerShellEngine
        Name: PowerShellVersion
    - Id: POWERSHELLEXE
      RegistrySearch:
        Id: POWERSHELLEXE
        Type: raw
        Root: HKLM
        Key: SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell
        Name: Path
    - Id: MY_PROPERTY
      Value: default value
    Launch:
      Condition: 'Installed OR (POWERSHELLEXE AND POWERSHELLVERSION >= "3.0")'
      Message: You must have PowerShell 3.0 or higher.
    StandardDirectory:
      Id: ProgramFilesFolder
      Directory:
        Id: MY_INSTALL_LOCATION
        Name: 04_PowerShellPreconditionCustomAction
    ComponentGroup:
      Directory: MY_INSTALL_LOCATION
      Id: ProductComponentGroup
      Component:
      - Id: cmp_FileToInstall_txt
        File:
          KeyPath: yes
          Source: FileToInstall.txt
      - Id: cmp_MyAppendScript_ps1
        File:
          KeyPath: yes
          Source: MyAppendScript.ps1
      - Id: cmp_RegistryEntry
        Guid: '*'
        RegistryKey:
          Root: HKLM
          Key: Software\[Manufacturer]\[ProductName]
          RegistryValue:
            KeyPath: yes
            Type: string
            Name: My property
            Value: '[MY_PROPERTY]'
    SetProperty:
      Id: CA_AppendTextUsingPowerShell
      Before: CA_AppendTextUsingPowerShell
      Sequence: execute
      Value: '"[POWERSHELLEXE]" -NoLogo -NonInteractive -NoProfile -ExecutionPolicy Bypass -File "[MY_INSTALL_LOCATION]MyAppendScript.ps1" -propertyValue "[MY_PROPERTY]"'
    CustomAction:
      Id: CA_AppendTextUsingPowerShell
      BinaryRef: Wix4UtilCA_X86
      DllEntry: WixQuietExec
      Execute: deferred
      Return: check
      Impersonate: no
    InstallExecuteSequence:
      Custom:
        Action: CA_AppendTextUsingPowerShell
        After: InstallFiles
        Condition: NOT Installed AND NOT WIX_UPGRADE_DETECTED
    Feature:
      Id: HelloWorldFeature
      ComponentGroupRef:
        Id: ProductComponentGroup
