Wix:
  xmlns: http://wixtoolset.org/schemas/v4/wxs
  Fragment:
    UI:
      Dialog:
        Id: MyCustomPropertiesDlg
        Width: '370'
        Height: '270'
        Title: '[ProductName] Setup'
        NoMinimize: yes
        Control:
        - Id: BannerBitmap
          Type: Bitmap
          X: '0'
          Y: '0'
          Width: '370'
          Height: '44'
          TabSkip: no
          Text: WixUI_Bmp_Banner
        - Id: Title
          Type: Text
          X: '15'
          Y: '6'
          Width: '200'
          Height: '15'
          Transparent: yes
          NoPrefix: yes
          Text: '{\WixUI_Font_Title}Custom properties'
        - Id: Description
          Type: Text
          X: '25'
          Y: '23'
          Width: '280'
          Height: '15'
          Transparent: yes
          NoPrefix: yes
          Text: Please enter custom properties
        - Id: BannerLine
          Type: Line
          X: '0'
          Y: '44'
          Width: '370'
          Height: '0'
        - Id: NameLabel
          Type: Text
          X: '30'
          Y: '60'
          Width: '100'
          Height: '15'
          TabSkip: no
          Text: '&amp;My property:'
        - Id: NameEdit
          Type: Edit
          X: '30'
          Y: '72'
          Width: '220'
          Height: '18'
          Property: MY_PROPERTY
          Text: '{80}'
        - Id: BottomLine
          Type: Line
          X: '0'
          Y: '234'
          Width: '370'
          Height: '0'
        - Id: Back
          Type: PushButton
          X: '180'
          Y: '243'
          Width: '56'
          Height: '17'
          Text: '&amp;Back'
          Publish:
            Event: NewDialog
            Value: InstallDirDlg
            Condition: '1'
        - Id: Next
          Type: PushButton
          X: '236'
          Y: '243'
          Width: '56'
          Height: '17'
          Default: yes
          Text: '&amp;Next'
          EnableCondition: 'MY_PROPERTY &lt;&gt; ""'
          DisableCondition: 'MY_PROPERTY = ""'
          Publish:
          - Event: SpawnWaitDialog
            Value: WaitForCostingDlg
            Condition: CostingComplete = 1
          - Event: NewDialog
            Value: VerifyReadyDlg
            Condition: MY_PROPERTY
        - Id: Cancel
          Type: PushButton
          X: '304'
          Y: '243'
          Width: '56'
          Height: '17'
          Cancel: yes
          Text: Cancel
          Publish:
            Event: SpawnDialog
            Value: CancelDlg
            Condition: '1'
