name: build-and-test

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

permissions:
  checks: write
  contents: read

jobs:
  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
#      - name: Install cargo-llvm-cov
#        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Prebuild embedded assets (schemas + generated files)
        run: cargo run --bin prebuild-assets

      - name: Lint with Clippy
        run: cargo clippy --workspace -- -D warnings
        env:
          WIXER_STRICT_ASSETS: "1"
      - name: Build
        run: cargo build --workspace
        env:
          WIXER_STRICT_ASSETS: "1"
      - name: Run tests
        run: cargo nextest run --workspace --profile ci
        env:
          WIXER_STRICT_ASSETS: "1"
      - name: Test docs
        run: cargo test --workspace --doc
        env:
          WIXER_STRICT_ASSETS: "1"
      - name: Debug - List junit files
        if: always()
        run: |
          echo "Searching for junit*.xml files:"
          find . -name "junit*.xml" -o -name "*.junit.xml" 2>/dev/null || dir /s /b junit*.xml 2>nul || echo "No files found"
          echo "Listing target/nextest:"
          ls -la target/nextest/ 2>/dev/null || dir target\nextest 2>nul || echo "Directory not found"
        shell: bash
      - name: Upload Test Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: "target/nextest/ci/junit.xml"
          require_tests: false
          include_passed: true
      # Package wixer installer (MSI + MSIX) and upload artifacts
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Install WiX extensions
        shell: pwsh
        run: |
          # Ensure dotnet global tools are on PATH
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

          wix --version

          # WiX v7 requires accepting the Open Source Maintenance Fee EULA
          # (https://wixtoolset.org/osmf/); this writes the acceptance file
          wix eula accept wix7

          # Extensions are separate packages; install them explicitly
          wix extension add --global WixToolset.Util.wixext
          wix extension add --global WixToolset.UI.wixext

          wix extension list --global

      - name: Setup Windows SDK tools (MakeAppx + signtool)
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem -Path "${Env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter MakeAppx.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $sdkBin) {
            Write-Error "MakeAppx.exe not found. Ensure the Windows SDK is installed on the runner."
            exit 1
          }
          $binDir = Split-Path $sdkBin.FullName -Parent
          Add-Content -Path $env:GITHUB_PATH -Value $binDir

          $signToolExe = Get-ChildItem -Path "${Env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($signToolExe) {
            $signDir = Split-Path $signToolExe.FullName -Parent
            Add-Content -Path $env:GITHUB_PATH -Value $signDir
          } else {
            Write-Warning "signtool.exe not found. MSI/MSIX signing will be skipped unless explicitly required."
          }

      - name: Install cargo-make
        run: cargo install cargo-make --locked

      - name: Build wixer packages (MSI + MSIX)
        env:
          WIXER_STRICT_ASSETS: "1"
        run: cargo make wixer-package

      - name: Compute package version + git hash
        id: pkg
        shell: pwsh
        run: |
          $meta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $pkg = $meta.packages | Where-Object { $_.name -eq "wixer" } | Select-Object -First 1
          if (-not $pkg) { throw "Unable to determine wixer version via cargo metadata" }
          $version = $pkg.version
          $sha = (git rev-parse --short HEAD).Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Generate documentation (HTML)
        shell: pwsh
        run: |
          $version = "${{ steps.pkg.outputs.version }}"
          $sha = "${{ steps.pkg.outputs.sha }}"
          cargo run --release --bin wixer -- doc --output-dir "target/wix-docs-$version-$sha" --format html

      - name: Rename artifacts with version + git hash
        shell: pwsh
        run: |
          $version = "${{ steps.pkg.outputs.version }}"
          $sha = "${{ steps.pkg.outputs.sha }}"
          Copy-Item -Path "target/wixer.msi" -Destination "target/wixer-$version-$sha.msi" -Force
          Copy-Item -Path "target/wixer.msix" -Destination "target/wixer-$version-$sha.msix" -Force

          $vsix = Get-ChildItem -Path "wixer-vscode/wixer-vscode-*.vsix" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($vsix) {
            Copy-Item -Path $vsix.FullName -Destination "target/wixer-vscode-$version-$sha.vsix" -Force
          } else {
            Write-Warning "VS Code extension .vsix not found under wixer-vscode/. Skipping standalone VSIX upload."
          }

          if (Test-Path "target/.wixer-tmp/codesign/wixer-dev-codesign.cer") {
            Copy-Item -Path "target/.wixer-tmp/codesign/wixer-dev-codesign.cer" -Destination "target/wixer-$version-$sha.cer" -Force
          }
          if (Test-Path "target/.wixer-tmp/codesign/subject.txt") {
            Copy-Item -Path "target/.wixer-tmp/codesign/subject.txt" -Destination "target/wixer-$version-$sha.codesign-subject.txt" -Force
          }
          if (Test-Path "target/.wixer-tmp/codesign/thumbprint.txt") {
            Copy-Item -Path "target/.wixer-tmp/codesign/thumbprint.txt" -Destination "target/wixer-$version-$sha.codesign-thumbprint.txt" -Force
          }

      - name: Upload wixer package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wixer-packages-${{ steps.pkg.outputs.version }}-${{ steps.pkg.outputs.sha }}
          path: |
            target/wixer-${{ steps.pkg.outputs.version }}-${{ steps.pkg.outputs.sha }}.msi
            target/wixer-${{ steps.pkg.outputs.version }}-${{ steps.pkg.outputs.sha }}.msix
            target/wixer-vscode-${{ steps.pkg.outputs.version }}-${{ steps.pkg.outputs.sha }}.vsix
            target/wixer-${{ steps.pkg.outputs.version }}-${{ steps.pkg.outputs.sha }}.cer
            target/wixer-${{ steps.pkg.outputs.version }}-${{ steps.pkg.outputs.sha }}.codesign-subject.txt
            target/wixer-${{ steps.pkg.outputs.version }}-${{ steps.pkg.outputs.sha }}.codesign-thumbprint.txt
            target/wix-docs-${{ steps.pkg.outputs.version }}-${{ steps.pkg.outputs.sha }}/
          if-no-files-found: warn
#      - name: Test with coverage
#        run: cargo llvm-cov nextest --workspace --profile ci --lcov --output-path lcov.info
#      - name: Upload coverage to Codecov
#        uses: codecov/codecov-action@v4
#        with:
#          token: ${{ secrets.CODECOV_TOKEN }}
