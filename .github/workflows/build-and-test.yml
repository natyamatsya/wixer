name: build-and-test

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

permissions:
  checks: write
  contents: read

jobs:
  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
#      - name: Install cargo-llvm-cov
#        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Prebuild embedded assets (schemas + generated files)
        run: cargo run --bin prebuild-assets

      - name: Lint with Clippy
        run: cargo clippy --workspace -- -D warnings
        env:
          WIXER_STRICT_ASSETS: "1"
      - name: Build
        run: cargo build --workspace
        env:
          WIXER_STRICT_ASSETS: "1"
      - name: Run tests
        run: cargo nextest run --workspace --profile ci
        env:
          WIXER_STRICT_ASSETS: "1"
      - name: Test docs
        run: cargo test --workspace --doc
        env:
          WIXER_STRICT_ASSETS: "1"
      - name: Debug - List junit files
        if: always()
        run: |
          echo "Searching for junit*.xml files:"
          find . -name "junit*.xml" -o -name "*.junit.xml" 2>/dev/null || dir /s /b junit*.xml 2>nul || echo "No files found"
          echo "Listing target/nextest:"
          ls -la target/nextest/ 2>/dev/null || dir target\nextest 2>nul || echo "Directory not found"
        shell: bash
      - name: Upload Test Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: "target/nextest/ci/junit.xml"
          require_tests: false
          include_passed: true
      # MSI Installer Build (Windows only)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build VS Code Extension
        run: |
          cd wixer-vscode
          npm install
          npm run compile
          npx @vscode/vsce package --no-dependencies
      - name: Install WiX Toolset
        run: dotnet tool install --global wix
      - name: Build Release
        run: cargo build --release
        env:
          WIXER_STRICT_ASSETS: "1"
      - name: Build MSI Installer
        run: cargo run --release --bin wixer -- build wixer.wxs.yaml -o target/wixer.msi
        env:
          WIXER_STRICT_ASSETS: "1"
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wixer-msi
          path: target/wixer.msi
          if-no-files-found: warn
#      - name: Test with coverage
#        run: cargo llvm-cov nextest --workspace --profile ci --lcov --output-path lcov.info
